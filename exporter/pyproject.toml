[project]
name = "trace-exporter"
version = "0.1.0"
description = "Exports MuJoCo grasp-slip clips: video, public sensors, private physics log"
requires-python = ">=3.12,<3.14"
dependencies = ["mujoco>=3.2", "numpy>=2.0", "pillow>=11.0", "trace-verifier"]

[tool.uv.sources]
trace-verifier = { path = "../verifier", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trace_exporter"]
