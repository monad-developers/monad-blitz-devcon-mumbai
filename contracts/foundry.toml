[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "../clips" }]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
anvil = "http://127.0.0.1:8545"
